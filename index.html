<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a22">
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Солнечный остров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one narrow column like a menu card, sticky category chips, dotted leaders between dish and price. Dark sea at night, sun-gold accent. */
:root {
  --bg: #0f1a22;
  --surface: #16242f;
  --line: #2a3d4b;
  --fg: #eef1ea;
  --muted: #93a6b2;
  --sun: #f6b73c;
  --sun-soft: #f6b73c22;
  --font-display: "Neucha", "Comic Sans MS", cursive;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}

.cover {
  position: relative;
  overflow: hidden;
  padding: 44px 20px 36px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  background:
    radial-gradient(circle at 50% 118%, #f6b73c55 0, #f6b73c18 34%, transparent 60%),
    linear-gradient(180deg, #0b141b 0%, var(--bg) 100%);
}
.cover { padding-top: 120px; }
.cover .photo, .cover .shade, .cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cover .photo { object-fit: cover; object-position: center 40%; max-width: none; }
.cover .shade { background: linear-gradient(180deg, rgba(15,26,34,.15) 0%, rgba(15,26,34,.55) 45%, var(--bg) 100%); }
.cover > :not(.photo):not(.shade):not(.phone):not(canvas) { position: relative; }
.cover .phone {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(15,26,34,.72);
  border: 1px solid #f6b73c88;
  color: var(--fg);
  font-weight: 800;
  font-size: 17px;
  letter-spacing: .03em;
  font-variant-numeric: tabular-nums;
  text-decoration: none;
  white-space: nowrap;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.cover .phone svg { width: 18px; height: 18px; color: var(--sun); }
.cover .phone:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
.cover h1 { text-shadow: 0 3px 18px rgba(0,0,0,.6); }
.cover p.sub { color: #d6e0e6; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
.eyebrow {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--sun);
}
.cover h1 {
  margin: 6px 0 4px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(40px, 12vw, 60px);
  line-height: 1.05;
  text-wrap: balance;
}
.cover p.sub { margin: 0; color: var(--muted); font-size: 15px; }
.sun {
  width: 64px; height: 32px;
  margin: 18px auto 0;
  border-radius: 64px 64px 0 0;
  background: var(--sun);
  box-shadow: 0 0 40px #f6b73c88;
}
.waves { display: block; width: 140px; height: 12px; margin: 6px auto 0; }

nav.cats {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: rgba(15,26,34,.92);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
nav.cats .track {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 16px;
  scrollbar-width: none;
  max-width: 640px;
  margin: 0 auto;
}
nav.cats .track::-webkit-scrollbar { display: none; }
nav.cats a {
  flex: none;
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--fg);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  transition: background .2s, color .2s, border-color .2s;
}
nav.cats a.active { background: var(--sun); border-color: var(--sun); color: #1b1305; }
nav.cats a:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

main {
  max-width: 640px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px 40px;
  overflow-x: hidden;
  overflow-x: clip;
}
section { padding-block: 26px 6px; }
.sec-head {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 112px;
  margin-bottom: 8px;
  padding: 12px 14px 12px 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background:
    radial-gradient(circle at 88% 50%, #f6b73c30 0, transparent 55%),
    linear-gradient(135deg, #1d3140 0%, var(--surface) 100%);
}
section:nth-of-type(even) .sec-head {
  flex-direction: row-reverse;
  padding: 12px 20px 12px 14px;
  background:
    radial-gradient(circle at 12% 50%, #f6b73c30 0, transparent 55%),
    linear-gradient(225deg, #1d3140 0%, var(--surface) 100%);
}
section:nth-of-type(even) .sec-head h2 { text-align: right; }
.art {
  flex: none;
  width: 104px;
  height: 104px;
  filter: drop-shadow(0 8px 14px rgba(0,0,0,.45));
  transition: transform .4s ease;
}
section:nth-of-type(odd) .art { transform: rotate(-6deg); }
section:nth-of-type(even) .art { transform: rotate(6deg); }
@media (hover: hover) { .sec-head:hover .art { transform: rotate(0) scale(1.06); } }
section h2 {
  min-width: 0;
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 30px;
  line-height: 1.1;
  color: var(--sun);
  text-wrap: balance;
}
@media (max-width: 380px) { section h2 { font-size: 26px; } .art { width: 88px; height: 88px; } }
ul.items { list-style: none; margin: 0; padding: 0; display: grid; }
ul.items li {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  padding-block: 10px;
  border-bottom: 1px dashed var(--line);
}
ul.items li:last-child { border-bottom: 0; }
.name { min-width: 0; flex: 0 1 auto; font-weight: 600; }
.name small { color: var(--muted); font-weight: 400; font-size: 14px; }
.desc {
  flex: 1 0 100%;
  margin-top: -4px;
  padding-right: 72px;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.4;
}
.dots { flex: 1 1 16px; min-width: 16px; border-bottom: 2px dotted #3a5262; transform: translateY(-4px); }
.price {
  flex: none;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
  background: var(--sun-soft);
  padding: 2px 10px;
  border-radius: 8px;
}
footer {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  border-top: 1px solid var(--line);
}
footer .brand { font-family: var(--font-display); font-size: 22px; color: var(--fg); }
</style>

</head>

    <ul class="items">${sec.items.map(([n, p, desc]) => {

      return `<li><span class="name">${esc(name)}${size ? ` <small>${esc(size).replace(" ", "&nbsp;")}</small>` : ""}</span><span class="dots"></span><span class="price">${p}&nbsp;₽</span>${desc ? `<span class="desc">${esc(desc)}</span>` : ""}</li>`;
    }).join("")}</ul>
  </section>`).join("");

catsEl.innerHTML = MENU.map(sec => `<a href="#${sec.id}" data-id="${sec.id}">${esc(sec.short || sec.title)}</a>`).join("");

const links = [...catsEl.querySelectorAll("a")];
function setActive(id) {
  links.forEach(a => {
    const on = a.dataset.id === id;
    a.classList.toggle("active", on);
    if (on) {
      const t = catsEl, l = a.offsetLeft - (t.clientWidth - a.offsetWidth) / 2;
      t.scrollTo({ left: l, behavior: "smooth" });
    }
  });
}
setActive(MENU[0].id);
const obs = new IntersectionObserver(entries => {
  const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
  if (vis[0]) setActive(vis[0].target.id);
}, { rootMargin: "-80px 0px -60% 0px" });
document.querySelectorAll("main section").forEach(s => obs.observe(s));

// soft sparkles on the water under the sun
(function () {
  const c = document.getElementById("sparkle");
  const ctx = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dots;
  function size() {
    const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
    w = r.width; h = r.height; c.width = w * d; c.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    dots = Array.from({ length: 40 }, () => ({ x: Math.random() * w, y: h * (0.55 + Math.random() * 0.45), p: Math.random() * 6.28, s: 0.6 + Math.random() * 1.4 }));
  }
  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    for (const d of dots) {
      const a = reduce ? 0.35 : 0.15 + 0.35 * (1 + Math.sin(t / 700 + d.p)) / 2;
      ctx.fillStyle = `rgba(246,183,60,${a})`;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.s, 0, 6.28); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  size(); addEventListener("resize", size); requestAnimationFrame(draw);
})();
